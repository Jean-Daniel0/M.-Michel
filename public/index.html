<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16358c">
<title>M.Michel</title>
<link rel="icon" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M.Michel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#12182b;--mute:#586078;--line:#d6dcea;--blue:#16358c;--on-blue:#fff;--red:#b80f2b;--green:#15704a;--amber:#8f5400;--soft:#e7ecfa;--warn:#fff3da;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1322;--card:#171e36;--ink:#eef1fa;--mute:#9ba5c0;--line:#29335a;--blue:#8aa6ff;--on-blue:#0b1230;--red:#ff7088;--green:#52d89a;--amber:#f2b955;--soft:#1e2851;--warn:#3a2f14;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{height:6px;background:linear-gradient(90deg,var(--blue) 0 66%,var(--red) 66% 100%)}
#hd{max-width:640px;margin:0 auto;padding:12px 16px 0}
#hd button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;color:var(--ink);font:700 1.15rem Georgia,"Times New Roman",serif;cursor:pointer}
#hd img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--blue)}
#app{max-width:640px;margin:0 auto;padding:16px 16px 64px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:2.4rem}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
.lead{color:var(--mute);margin:0 0 1.4em;max-width:36ch}
.banner{position:relative;border-radius:20px;overflow:hidden;margin:6px 0 24px;min-height:440px;color:#fff;background:#16358c;isolation:isolate;border-bottom:5px solid #c4122f}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 6%;z-index:-2}
.banner::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,20,60,0) 0%,rgba(10,20,60,0) 34%,rgba(10,20,60,.8) 60%,rgba(10,20,60,.95) 100%)}
.banner .over{padding:250px 20px 22px}
.banner .eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#ffd9df;margin:0 0 4px}
.banner h1{color:#fff;font-size:2rem;margin:0 0 .4em;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.banner p{margin:0 0 .7em;color:#fff;max-width:46ch;font-size:.98rem;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.banner p:last-child{margin-bottom:0}
.sw.white{box-shadow:inset 0 0 0 1.5px var(--line)}
.paper.editor span[style*="255, 255, 255"],.paper.editor span[style*="#ffffff"]{background:#d9deea}
.paper::selection,.paper *::selection{background:#abe1f7}
.paper::-moz-selection,.paper *::-moz-selection{background:#abe1f7}
.paper span[style*="#ffffff"]::selection,.paper span[style*="#ffffff"] *::selection{background:#abe1f7;color:#abe1f7;text-shadow:none}
.paper span[style*="#ffffff"]::-moz-selection,.paper span[style*="#ffffff"] *::-moz-selection{background:#abe1f7;color:#abe1f7;text-shadow:none}
.titlebar{position:sticky;top:0;z-index:20;background:#16358c;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.titlebar div{max-width:640px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.titlebar img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #fff;flex:none}
.titlebar b{font:700 1.2rem Georgia,"Times New Roman",serif;letter-spacing:.01em}
.titlebar span{margin-left:auto;font-size:.8rem;opacity:.85;text-align:right}
.subjects{margin:34px 0 8px}
.subjects h2{margin:0 0 4px}
.sj{display:grid;gap:12px;margin-top:12px}
.sj figure{margin:0;position:relative;border-radius:14px;overflow:hidden;background:var(--soft);aspect-ratio:16/8}
.sj img,.cover{display:block;width:100%;height:100%;object-fit:cover}
.sj figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;color:#fff;font:700 1.05rem Georgia,"Times New Roman",serif;background:linear-gradient(180deg,rgba(10,20,60,0),rgba(10,20,60,.85))}
.ai{border:1.5px dashed var(--blue);border-radius:12px;padding:14px;margin:18px 0}
.ai textarea{min-height:110px}
.aitag{display:inline-block;margin:0 0 6px;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--warn);color:var(--amber)}
.cover{height:110px;border-radius:10px;margin:0 0 12px}
.contact{margin:34px 0 8px}
.contact h2{margin:0 0 4px}
.soc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.soc a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
.soc a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.soc svg{width:42px;height:42px}
.bar2{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 10px}
.bar2 i{display:block;height:100%;background:var(--blue)}
.bar2.bad i{background:var(--red)}
.portrait{position:relative;margin:6px 0 28px;max-width:340px}
.portrait img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 12%;border-radius:20px;box-shadow:9px 9px 0 var(--blue)}
.portrait figcaption{position:absolute;left:-6px;bottom:20px;max-width:88%;background:var(--card);color:var(--ink);padding:10px 16px;border-radius:0 12px 12px 0;border-left:5px solid var(--red);box-shadow:0 8px 20px rgba(0,0,0,.28)}
.portrait figcaption b{display:block;font:700 1.15rem/1.2 Georgia,"Times New Roman",serif}
.portrait figcaption span{font-size:.85rem;color:var(--mute)}
.about{margin:0 0 1.2em;max-width:46ch}
.paper{background:#fff;color:#111;border-radius:12px;padding:16px;line-height:1.6;-webkit-user-select:text;user-select:text;color-scheme:only light;overflow-wrap:anywhere}
.paper p{margin:0 0 .7em}
.paper h3{color:#111;margin:.8em 0 .3em}
.paper ul,.paper ol{padding-left:1.3em;margin:0 0 .7em}
.paper.editor{min-height:200px;caret-color:#111;outline:none}
.paper.editor:focus{box-shadow:0 0 0 3px var(--blue)}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.sw{width:34px;height:34px;border-radius:50%;border:0;padding:0;cursor:pointer}
.tbtn{min-width:40px;min-height:36px;padding:4px 10px;border:0;border-radius:8px;background:var(--soft);color:var(--blue);font:inherit;font-weight:700;cursor:pointer}
body.white{--bg:#fff;--card:#fff;--ink:#111;--mute:#444;--line:#ddd;--blue:#16358c;--on-blue:#fff;--soft:#e7ecfa;--red:#b80f2b;background:#fff;color:#111;color-scheme:only light}
body.white .paper{padding:4px 0;border-radius:0}
.big{font-size:2rem}
.hero{display:block;width:100%;max-width:250px;aspect-ratio:1/1;object-fit:cover;border-radius:16px;margin:8px 0 22px 0;box-shadow:7px 7px 0 var(--blue)}
.hint{color:var(--mute);font-size:.9rem;margin:.4em 0 0}
.btn{display:block;width:100%;min-height:50px;padding:12px 16px;margin:0 0 10px;border:1.5px solid var(--blue);border-radius:10px;background:transparent;color:var(--blue);font:inherit;font-weight:600;text-align:center;cursor:pointer}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.small{display:inline-block;width:auto;min-height:40px;padding:8px 14px;margin:0 8px 8px 0;font-size:.92rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-visible,#hd button:focus-visible,.back:focus-visible{outline:3px solid var(--red);outline-offset:2px}
label{display:block;font-weight:600;margin:14px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:96px;resize:vertical}
.grid{border-collapse:collapse;font-size:.9rem;width:100%}.grid th,.grid td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}.grid th{background:var(--soft);color:var(--blue)}.grid td.nm{text-align:left}.grid small{font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;margin:6px 0}
.row .grow{flex:1}
.row input[type=radio],.row input[type=checkbox]{width:22px;height:22px;flex:none}
.check{display:flex;gap:10px;align-items:center;font-weight:500;margin:12px 0 0}
.check input{width:22px;height:22px;flex:none}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--soft);color:var(--blue);margin:0 6px 6px 0}
.tag.warn{background:var(--warn);color:var(--amber)}
.tag.ok{color:var(--green)}
.code{font:700 1.6rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;color:var(--blue)}
.err{color:var(--red);font-weight:600;margin:12px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;color:var(--mute);font-weight:600}
.timer{font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low{color:var(--red)}
.qtext{font-family:Georgia,serif;font-size:1.3rem;line-height:1.35;margin:0 0 18px;-webkit-user-select:none;user-select:none;white-space:pre-wrap}
.opt{display:block;width:100%;min-height:52px;margin:0 0 10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;-webkit-user-select:none;user-select:none}
.opt.sel{border-color:var(--blue);background:var(--soft);font-weight:600}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 0 20px}
.prog i{display:block;height:100%;background:var(--blue)}
ul.rules{padding-left:1.2em;margin:0 0 1.2em}
ul.rules li{margin:.4em 0}
.ans{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.ans b{display:block}
.muted{color:var(--mute)}
.good{color:var(--green);font-weight:600}
.bad{color:var(--red);font-weight:600}
.back{display:inline-block;margin:0 0 14px;color:var(--blue);background:none;border:0;padding:6px 0;font:inherit;font-weight:600;cursor:pointer}
.mascot{display:flex;gap:10px;align-items:flex-end;margin:0 0 16px}
.mascot svg{flex:none}
.bubble{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;font-weight:600;line-height:1.35;margin-bottom:22px}
.mascot.small{margin:0 0 14px}
.mascot.small .bubble{margin-bottom:8px;font-size:.92rem;font-weight:500}
.av{display:block;overflow:visible}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes conf{0%{transform:translateY(-12px) rotate(0);opacity:1}100%{transform:translateY(40px) rotate(200deg);opacity:0}}
@media(prefers-reduced-motion:no-preference){
.prog i{transition:width .25s}
.av-bob{animation:bob 3.2s ease-in-out infinite}
.av-blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.av-wave{transform-origin:160px 178px;animation:wave 1.1s ease-in-out infinite}
.av-conf rect{animation:conf 1.8s linear infinite}
}
</style>
</head>
<body>
<div class="bar"></div>
<div id="tb" class="titlebar" style="display:none"><div><img src="/avatar.webp" width="36" height="36" alt=""><b>M.Michel</b><span>Devoirs · Quiz · Consignes</span></div></div>
<header id="hd"><button onclick="goHome()" aria-label="Accueil M.Michel"><img src="/avatar.webp" width="40" height="40" alt=""><span>M.Michel</span></button></header>
<main id="app"></main>
<script src="/avatar.js"></script>
<script>
/* ---------- PWA : installation ---------- */
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
let installEv=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;if(S.view==='home')render();setTimeout(showInstallPopup,2500)});
window.addEventListener('appinstalled',()=>{installEv=null;closeInstallPopup();if(S.view==='home')render()});
async function installApp(){if(!installEv)return;closeInstallPopup();installEv.prompt();try{await installEv.userChoice}catch(e){}installEv=null;render()}
function closeInstallPopup(){const e=document.getElementById('ipop');if(e)e.remove()}
function laterInstall(){store.set('mm_inst_later',String(Date.now()));closeInstallPopup()}
function showInstallPopup(){
  if(document.getElementById('ipop')||isStandalone()||S.view==='take')return;
  const t=parseInt(store.get('mm_inst_later'))||0;if(Date.now()-t<3*864e5)return;
  const ios=isIOS();if(!installEv&&!ios)return;
  const d=document.createElement('div');d.id='ipop';d.setAttribute('role','dialog');d.setAttribute('aria-label',"Installer l'application");
  d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px';
  d.innerHTML=`<div style="max-width:520px;margin:0 auto;background:#fff;border:1.5px solid #c9d3ea;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><img src="/icon-192.png" width="56" height="56" alt="" style="border-radius:12px"><div style="flex:1;min-width:180px"><b>Installer M.Michel</b><div class="muted" style="font-size:.9rem">${ios?'Touche <b>Partager</b> puis <b>Sur l\'écran d\'accueil</b>.':'Ajoute le site à ton écran d\'accueil : accès rapide, comme une application.'}</div></div><div style="display:flex;gap:8px;width:100%;justify-content:flex-end">${ios?'':'<button class="btn small primary" onclick="installApp()">Installer</button>'}<button class="btn small" onclick="laterInstall()">${ios?'OK':'Plus tard'}</button></div></div>`;
  document.body.appendChild(d);
}
window.addEventListener('load',()=>setTimeout(()=>{if(isIOS())showInstallPopup()},3000));
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone;
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone;
const MSG_ICON='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><path fill="currentColor" d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>';
const seenKey=()=>'mm_seen:'+S.code+':'+(S.stu?S.stu.pseudo:'');
const getSeen=()=>parseInt(store.get(seenKey()))||0;
function setSeen(ts){if(ts>getSeen())store.set(seenKey(),String(ts))}
function setBadge(n){
  S.unread=n;
  const b=document.getElementById('chbadge');
  if(b){b.textContent=n>99?'99+':n;b.style.display=n>0?'inline-flex':'none'}
  try{if(navigator.setAppBadge){n>0?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}
}
async function checkUnread(){
  if(!S.stu||S.view==='chat'||document.hidden)return;
  try{
    let seen=getSeen();
    if(!seen){const r=await api('/api/chat/unread?since=0');if(!store.get(seenKey())){/* première fois : on ne compte pas l'ancien historique */setSeen(r.last||1);return setBadge(0)}}
    const r=await api('/api/chat/unread?since='+seen);setBadge(r.count);
  }catch(e){}
}
let unreadTimer=null;
setInterval(()=>{if(S.view==='devoirs'||S.view==='mynotes'||S.view==='profile')checkUnread()},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUnread()});
function vInstall(){
  if(isStandalone())return '';
  if(installEv)return '<button class="btn" onclick="installApp()">📲 Installer l\'application sur mon téléphone</button>';
  if(isIOS())return '<p class="hint" style="text-align:center">📲 Pour installer : touche <b>Partager</b> puis <b>Sur l\'écran d\'accueil</b>.</p>';
  return '';
}
/* ---------- Notifications (OneSignal) ---------- */
let OSAPP='',osReady=false;
window.OneSignalDeferred=window.OneSignalDeferred||[];
async function initPush(){
  try{
    const r=await fetch('/api/config');const j=await r.json();OSAPP=j.onesignalAppId||'';
    if(!OSAPP)return;
    const sc=document.createElement('script');sc.src='https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';sc.defer=true;document.head.appendChild(sc);
    OneSignalDeferred.push(async function(OneSignal){
      await OneSignal.init({appId:OSAPP,serviceWorkerPath:'/sw.js',serviceWorkerParam:{scope:'/'},notifyButton:{enable:false},allowLocalhostAsSecureOrigin:true});
      osReady=true;window.OneSignal=OneSignal;
      pushIdentify();if(S.view==='devoirs')render();
    });
  }catch(e){}
}
function pushIdentify(){try{if(osReady&&S.stu&&S.code)window.OneSignal.login(S.code+':'+S.stu.pseudo)}catch(e){}}
function pushState(){
  if(!osReady)return 'off';
  try{if(!('Notification' in window))return 'off';if(Notification.permission==='denied')return 'denied';
    return (window.OneSignal.Notifications.permission&&window.OneSignal.User.PushSubscription.optedIn)?'on':'ask'}catch(e){return 'off'}
}
async function enablePush(){
  try{await window.OneSignal.Notifications.requestPermission();pushIdentify();await window.OneSignal.User.PushSubscription.optIn()}catch(e){}
  render();
}
function vPush(){
  const st=pushState();
  if(st==='ask')return '<button class="btn small" onclick="enablePush()">🔔 Activer les notifications</button>';
  return '';
}
window.addEventListener('load',()=>setTimeout(initPush,500));
/* ---------- Réseau ---------- */
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const AUTH=['/api/quizzes','/api/results','/api/classes','/api/me','/api/generate'];
const SAUTH=['/api/student/me','/api/student/profile','/api/chat','/api/student/history','/api/brief','/api/start','/api/answer','/api/finish','/api/flags'];
async function api(path,method,body,keepalive){
  const h={'Content-Type':'application/json'};
  const tk=store.get('mm_token');
  if(tk&&AUTH.some(p=>path.indexOf(p)===0))h.Authorization='Bearer '+tk;
  const st=store.get('mm_st');
  if(st&&SAUTH.some(p=>path.indexOf(p)===0))h.Authorization='Bearer '+st;
  let r;
  try{r=await fetch(path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined,keepalive:!!keepalive})}
  catch(e){throw{message:'Pas de connexion. Vérifie ton réseau et réessaie.',status:0}}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){
    if(r.status===401&&h.Authorization&&AUTH.some(p=>path.indexOf(p)===0)){store.del('mm_token');S.token=false;S.view='home';render()}
    else if(r.status===401&&h.Authorization&&SAUTH.some(p=>path.indexOf(p)===0)){store.del('mm_st');S.stu=null;if(S.view!=='take'){S.err='Reconnecte-toi.';S.view=S.code?'slogin':'home';render()}}
    throw{message:j.error||'Une erreur est survenue.',status:r.status};
  }
  return j;
}

/* ---------- Outils ---------- */
const app=()=>document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtDate=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''};
const SUBJECTS=['Informatique','Éducation à la citoyenneté','Éducation esthétique et artistique','Autre'];
const TYPE={quiz:'Quiz',devoir:'Devoir',libelle:'Consigne'};
const COLORS=[['Blanc','#ffffff'],['Noir','#111111'],['Bleu','#16358c'],['Rouge','#b80f2b'],['Vert','#15704a'],['Orange','#c25a00'],['Violet','#6b2fa0'],['Gris','#555555']];
let S={view:'home',err:'',busy:false};
let timerId=null;
const SAY=['Lis bien la question. Prends ton temps.','Continue, tu avances bien.','Réfléchis avec tes propres mots.','Tu y es presque, courage !'];

function go(v){S.view=v;S.err='';render()}
function goHome(){if(S.view==='take')return;go('home')}
function render(){
  const v={profile:vProfile,chat:vChat,tchat:vTChat,studs:vStuds,slogin:vSLogin,mynotes:vMyNotes,carnet:vCarnet,sprog:vSProg,studs:vStuds,stats:vStats,home:vHome,devoirs:vDevoirs,brief:vBrief,intro:vIntro,take:vTake,done:vDone,thome:vTHome,cedit:vCEdit,tclass:vTClass,editor:vEditor,results:vResults,detail:vDetail}[S.view];
  if(S.view!=='chat')stopChat();
  app().innerHTML=v();

function pickPhoto(inp){

/* ---------- Chat de classe (élève) ---------- */
function stopChat(){if(S.ch&&S.ch.timer){clearInterval(S.ch.timer);S.ch.timer=null}}
function openChat(){
  S.ch={msgs:[],since:0,open:true,reason:'',timer:null,busy:false};S.err='';S.prof=S.prof||{};setBadge(0);
  S.view='chat';render();pollChat();
  S.ch.timer=setInterval(()=>{if(!document.hidden)pollChat()},6000);

async function pollChat(){
  const c=S.ch;if(!c||S.view!=='chat')return;
  try{
    const r=await api('/api/chat?since='+c.since);
    c.open=r.open;c.reason=r.reason||'';
    if(r.messages.length){
      const have=new Set(c.msgs.map(m=>m.id));
      r.messages.forEach(m=>{if(!have.has(m.id))c.msgs.push(m);c.since=Math.max(c.since,m.ts)});
      c.msgs=c.msgs.slice(-100);
    }
    c.err='';
    // masquer les messages supprimés : si le serveur n'en a plus, on resynchronise régulièrement
    if(!c.sync||Date.now()-c.sync>30000){c.sync=Date.now();const f=await api('/api/chat?since=0');c.msgs=f.messages;c.since=f.messages.reduce((a,m)=>Math.max(a,m.ts),0)}
    c.msgs.forEach(m=>setSeen(m.ts));
    paintChat(true);loadProfiles();
  }catch(e){c.err=e.message;paintChat(false)}
}
async function loadProfiles(){
  const c=S.ch;if(!c)return;
  const need=[...new Set(c.msgs.filter(m=>{const p=S.prof[m.pk];return !p||Date.now()-(p.at||0)>300000}).map(m=>m.pk))].slice(0,6);
  for(const pk of need){
    S.prof[pk]={pv:-1,name:'',at:Date.now()};
    try{const r=await api('/api/student/profile/'+encodeURIComponent(pk));S.prof[pk]=Object.assign({at:Date.now()},r.profile)}catch(e){S.prof[pk]={pv:0,name:'',at:Date.now()}}
  }
  if(need.length)paintChat(false);
}

function paintChat(stick){
  const c=S.ch;if(!c||S.view!=='chat')return;
  const box=document.getElementById('chmsgs');if(!box)return;
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<80;

<text x="2" y="${y(10)+4}" font-size="10" fill="#667">10</text><text x="6" y="${y(5)+4}" font-size="10" fill="#667">5</text><text x="6" y="${y(0)+4}" font-size="10" fill="#667">0</text>
<polyline points="${line}" fill="none" stroke="#16358c" stroke-width="2.5"/>
${pts.map(a=>`<circle cx="${x(h.indexOf(a))}" cy="${y(a.score10)}" r="4.5" fill="#16358c"/>`).join('')}</svg>`;
}

async function startRun(){
  if(!S.stu)return go('slogin');

  try{

    beginRun(r.state);
  }catch(e){setErr(e.message)}
}
function beginRun(st){
  S.run={i:st.i,total:st.total,q:st.question,sel:null,flags:Object.assign({paste:0,leave:0,leaveMs:0,jump:0},st.flags),qStart:Date.now(),end:st.remaining!==null?Date.now()+st.remaining:null,hiddenAt:null,sending:false,finishing:false,warned:false,mood:'think',say:SAY[0]};
  window.onbeforeunload=e=>{e.preventDefault();e.returnValue='';return ''};
  history.pushState(null,'',location.href);
  window.onpopstate=()=>history.pushState(null,'',location.href);
  clearInterval(timerId);timerId=setInterval(tick,1000);
  S.err='';S.view='take';render();
}
function tick(){
  const r=S.run;if(!r||S.view!=='take')return;
  if(!r.end)return;
  const left=r.end-Date.now();
  const el=document.getElementById('timer');
  if(el){el.textContent=fmtT(left);el.classList.toggle('low',left<60000)}
  if(left<60000&&left>0&&!r.warned){r.warned=true;setMood('wow',"Plus qu'une minute !")}
  if(left<=0&&!r.finishing)timeUp();
}
function body(extra){return Object.assign({qid:S.dv&&S.dv.id,token:S.token_att,flags:S.run?S.run.flags:undefined},extra||{})}
function sendFlags(){if(S.run&&S.view==='take')api('/api/flags','POST',body(),true).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{
  const r=S.run;if(!r||S.view!=='take')return;
  if(document.hidden){r.hiddenAt=Date.now();r.flags.leave++;sendFlags()}
  else if(r.hiddenAt){r.flags.leaveMs+=Date.now()-r.hiddenAt;r.hiddenAt=null;sendFlags()}
});

function vTake(){
  const r=S.run,q=r.q;
  let inp='';
  if(q.t==='qcm')inp=q.opts.map((o,k)=>`<button class="opt ${r.sel===k?'sel':''}" onclick="pick(${k})">${esc(o)}</button>`).join('');
  else if(q.t==='vf')inp=['Vrai','Faux'].map((o,k)=>`<button class="opt ${r.sel===k?'sel':''}" onclick="pick(${k})">${o}</button>`).join('');
  else if(q.t==='court')inp=`<input type="text" id="txt" autocomplete="off" aria-label="Ta réponse" placeholder="Ta réponse" oninput="onTxt(event)" onpaste="return noPaste(event)" ondrop="return noPaste(event)">`;
  else inp=`<textarea id="txt" aria-label="Ta réponse" placeholder="Écris ta réponse avec tes propres mots" oninput="onTxt(event)" onpaste="return noPaste(event)" ondrop="return noPaste(event)"></textarea>`;
  const why=q.why?`<label for="why">Explique ta réponse en une ou deux phrases</label><textarea id="why" oninput="onTxt(event)" onpaste="return noPaste(event)" ondrop="return noPaste(event)"></textarea>`:'';
  const last=r.i===r.total-1;
  return `
<div class="top"><span>Question ${r.i+1} sur ${r.total}</span>${r.end?`<span class="timer" id="timer">${fmtT(r.end-Date.now())}</span>`:''}</div>
<div class="prog"><i style="width:${(r.i/r.total)*100}%"></i></div>
<div id="mc">${mascot(r.mood,r.say,72,'small')}</div>
<p class="qtext" oncopy="return false" oncontextmenu="return false">${esc(q.q)}</p>
${inp}${why}
<p class="err" id="msg" role="status">${esc(S.err)}</p>
<button class="btn primary" id="nx" onclick="next()" ${canNext()?'':'disabled'}>${last?'Terminer et rendre':'Valider et continuer'}</button>`}

function canNext(){
  const r=S.run,q=r.q;
  const t=document.getElementById('txt'),w=document.getElementById('why');
  let ok;
  if(q.t==='qcm'||q.t==='vf')ok=r.sel!==null;
  else ok=!!(t&&t.value.trim().length>0);
  if(ok&&q.why)ok=!!(w&&w.value.trim().length>=10);
  return ok&&!r.sending;
}
function pick(k){const r=S.run;r.sel=k;S.err='';const w=document.getElementById('why');const wv=w?w.value:'';render();const nw=document.getElementById('why');if(nw){nw.value=wv;nw.dataset.prev=wv.length}upd()}
function upd(){const b=document.getElementById('nx');if(b)b.disabled=!canNext()}
function onTxt(e){
  const el=e.target,prev=+(el.dataset.prev||0),d=el.value.length-prev;
  if(/paste|drop/i.test(e.inputType||''))S.run.flags.paste++;
  else if(d>20&&!e.isComposing)S.run.flags.jump++;
  el.dataset.prev=el.value.length;upd();
}
function setMood(m,t){const r=S.run;if(!r)return;r.mood=m;r.say=t;const el=document.getElementById('mc');if(el)el.innerHTML=mascot(m,t,72,'small')}
function noPaste(e){S.run.flags.paste++;setMood('oops','Coller est désactivé : écris avec tes propres mots.');return false}
function current(){
  const r=S.run,q=r.q,t=document.getElementById('txt'),w=document.getElementById('why');
  const given=(q.t==='qcm'||q.t==='vf')?r.sel:(t?t.value:'');
  return{given,why:w?w.value:''};
}
async function next(){
  const r=S.run;if(!canNext())return;
  r.sending=true;upd();
  try{
    const res=await api('/api/answer','POST',body(current()));
    r.sending=false;
    if(res.done)return showDone(res);
    r.i=res.state.i;r.q=res.state.question;r.sel=null;r.qStart=Date.now();S.err='';if(!r.warned){r.mood='think';r.say=SAY[r.i%SAY.length]}render();
  }catch(e){r.sending=false;S.err=e.message;render()}
}
async function timeUp(){
  const r=S.run;if(r.finishing)return;r.finishing=true;
  try{
    const res=await api('/api/finish','POST',body(current()));
    showDone(res);
  }catch(e){
    if(e.status===400){setTimeout(()=>{r.finishing=false},2000)}
    else{S.err=e.message;r.finishing=false;render()}
  }
}
function showDone(res){
  clearInterval(timerId);window.onbeforeunload=null;window.onpopstate=null;
  S.run=null;S.result=res;S.view='done';render();
}

function vDone(){
  const res=S.result,sc=res.summary||{s:0,t:0,p:0};
  const auto=sc.t-sc.p,ratio=auto>0?sc.s/auto:1;
  const mood=res.timeUp?'oops':ratio>=0.7?'cheer':ratio>=0.4?'happy':'oops';
  const say=res.timeUp?'Le temps est écoulé, mais ton travail est bien rendu.':ratio>=0.7?'Bravo ! Excellent travail !':ratio>=0.4?'Bien joué ! Continue comme ça.':'Courage ! Relis ton cours, tu vas progresser.';
  return `${mascot(mood,say,150)}
<h2>Travail rendu</h2>
${res.timeUp?'<p class="err">Le temps était écoulé : les réponses non données comptent comme fausses.</p>':''}
<div class="card"><p style="margin:0">Score automatique : <b>${sc.s} / ${sc.t}</b></p>
${sc.p?`<p class="hint">${sc.p} question${sc.p>1?'s':''} rédigée${sc.p>1?'s':''} à corriger par ton professeur.</p>`:''}</div>

function score(res){
  let s=0,p=0;
  res.answers.forEach((a,i)=>{const m=res.manual?res.manual[i]:undefined;const e=(m!==undefined&&m!==null)?m:(a.ok===true?1:a.ok===false?0:null);if(e===1)s++;else if(e===null)p++});
  return{s,p,t:res.total||res.answers.length};
}

function blankQ(t){return{t,q:'',opts:['','','',''],a:t==='vf'?'vrai':(t==='qcm'?0:''),why:false}}
function newQuiz(classId){S.d={id:'',classId,title:'',subject:SUBJECTS[0],mode:'quiz',minutes:15,deadline:'',draw:0,brief:'',draft:false,qs:[blankQ('qcm')],period:'',coef:1};S.ai={text:'',count:10,types:['qcm','vf'],busy:false,msg:'',ok:false};S.err='';S.view='editor';render()}
async function editQuiz(id){try{const r=await api('/api/quizzes/'+id);S.d=r.quiz;S.d.coef=S.d.coef||1;S.ai={text:'',count:10,types:['qcm','vf'],busy:false,msg:'',ok:false};S.err='';S.view='editor';render()}catch(e){S.err=e.message;render()}}

${mascot('hello','Écris tes questions, je m\'occupe du reste !',84,'small')}
<h2>${d.id?'Modifier':'Nouveau'} ${lib?'libellé':d.mode==='devoir'?'devoir':'quiz'}</h2>

<label for="f2">Matière</label><select id="f2" onchange="S.d.subject=this.value">${SUBJECTS.map(s=>`<option ${s===d.subject?'selected':''}>${esc(s)}</option>`).join('')}</select>
${lib?'':`<label for="f8">Période (pour le carnet de notes)</label><select id="f8" onchange="S.d.period=this.value"><option value="">— Aucune —</option>${((S.tc&&S.tc.class&&S.tc.class.periods)||[]).map(x=>`<option ${x===d.period?'selected':''}>${esc(x)}</option>`).join('')}</select>
<label for="f9">Coefficient</label><select id="f9" onchange="S.d.coef=+this.value">${[0.5,1,1.5,2,3,4,5].map(x=>`<option value="${x}" ${x===d.coef?'selected':''}>${fmtS(x)}</option>`).join('')}</select>

<label for="f6">Date limite (facultatif)</label><input type="date" id="f6" value="${esc(d.deadline)}" oninput="S.d.deadline=this.value">
${lib?'':`<label for="f7">Questions tirées au hasard par élève (0 = toutes)</label><input type="number" id="f7" min="0" value="${d.draw}" oninput="S.d.draw=Math.max(0,+this.value||0)">
<p class="hint">Astuce : écris 20 questions et fais-en tirer 10. Chaque élève reçoit un quiz différent, dans un ordre différent.</p>`}
<label id="bl">Libellé du devoir ${lib?'':'(facultatif)'}</label>
<div class="tb" role="toolbar" aria-label="Mise en forme">
${COLORS.map(c=>`<button class="sw${c[1]==='#ffffff'?' white':''}" style="background:${c[1]}" aria-label="Écrire en ${c[0]}" onpointerdown="event.preventDefault()" onclick="fmt('foreColor','${c[1]}')"></button>`).join('')}
<button class="tbtn" aria-label="Gras" onpointerdown="event.preventDefault()" onclick="fmt('bold')"><b>G</b></button>

</div>

<p class="hint">Sélectionne des mots (appui long), puis touche une couleur. La page de l'élève reste blanche : le texte blanc y est invisible (ici, il apparaît grisé pour que tu le retrouves). L'élève pourra copier ce texte.</p>
${lib?'':vAI()}

<button class="btn" onclick="saveQuiz(true)">Enregistrer en brouillon</button>
<p class="hint">Un brouillon reste invisible pour les élèves tant que tu ne le publies pas.</p>`}
function vAI(){
  const a=S.ai||(S.ai={text:'',count:10,types:['qcm','vf'],busy:false,msg:'',ok:false});
  const T=[['qcm','Choix multiple'],['vf','Vrai ou faux'],['court','Réponse courte'],['long','Réponse rédigée']];
  return `<div class="ai"><h3 style="margin:0 0 4px">Générer les questions avec l'IA</h3>
<p class="hint" style="margin:0 0 8px">Colle ton résumé de cours, ou écris juste le titre de la leçon. Les questions arrivent en brouillon : tu les relis avant de publier. La génération peut prendre une vingtaine de secondes.</p>
<label for="aitxt" style="margin-top:6px">Cours ou leçon</label>
<textarea id="aitxt" oninput="S.ai.text=this.value">${esc(a.text)}</textarea>
<label for="aicnt">Nombre de questions (1 à 20)</label>
<input type="number" id="aicnt" min="1" max="20" value="${a.count}" oninput="S.ai.count=Math.max(1,Math.min(20,+this.value||10))">
${T.map(t=>`<label class="check"><input type="checkbox" ${a.types.includes(t[0])?'checked':''} onchange="aiType('${t[0]}',this.checked)"> ${t[1]}</label>`).join('')}
<p></p>
<button class="btn primary" id="aibtn" onclick="aiGo()" ${a.busy?'disabled':''}>${a.busy?'Génération en cours…':'Générer le brouillon'}</button>
<p class="${a.ok?'good':'err'}" role="status" id="aimsg" style="margin:6px 0 0">${esc(a.msg)}</p></div>`}
function keepAi(){const el=document.getElementById('aibtn');if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'})}
function aiType(t,on){const a=S.ai;a.types=on?[...new Set([...a.types,t])]:a.types.filter(x=>x!==t)}
async function aiGo(){
  const a=S.ai,d=S.d;
  if(!a.types.length){a.msg='Choisis au moins un type de question.';a.ok=false;return render()}
  if(a.text.trim().length<8){a.msg='Colle ton cours ou écris le titre de la leçon.';a.ok=false;return render()}
  a.busy=true;a.msg='';render();keepAi();
  try{
    const r=await api('/api/generate','POST',{text:a.text,count:a.count,types:a.types,subject:d.subject,mode:d.mode,level:(S.tc&&S.tc.class&&S.tc.class.name)||''});
    r.qs.forEach(q=>q.ai=true);
    const onlyBlank=d.qs.length===1&&!d.qs[0].q.trim();
    d.qs=onlyBlank?r.qs:d.qs.concat(r.qs);
    d.draft=true;
    a.busy=false;a.ok=true;a.msg=r.qs.length+' question'+(r.qs.length>1?'s':'')+' ajoutée'+(r.qs.length>1?'s':'')+' en brouillon. Relis chacune avant de publier.'+(r.qs.length<r.asked?' (L\'IA en a produit moins que demandé.)':'');
    render();
    const f=document.querySelector('.card .aitag');if(f)f.scrollIntoView({block:'center'});else keepAi();
  }catch(e){a.busy=false;a.ok=false;a.msg=e.message;render();keepAi()}
}
function fmt(c,v){
  const el=document.getElementById('brief');el.focus();
  try{document.execCommand('defaultParagraphSeparator',false,'p');document.execCommand('styleWithCSS',false,true)}catch(e){}
  document.execCommand(c,false,v||null);
  S.d.brief=el.innerHTML;
}
function pastePlain(e){
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
  S.d.brief=document.getElementById('brief').innerHTML;
}
function qCard(q,i){
  let b='';
  if(q.t==='qcm')b=q.opts.map((o,k)=>`<div class="row"><input type="radio" name="c${i}" ${q.a===k?'checked':''} onchange="S.d.qs[${i}].a=${k}" aria-label="Bonne réponse : choix ${k+1}"><input type="text" class="grow" value="${esc(o)}" placeholder="Choix ${k+1}" aria-label="Choix ${k+1}" oninput="S.d.qs[${i}].opts[${k}]=this.value"></div>`).join('')+'<p class="hint">Coche la bonne réponse.</p>';
  else if(q.t==='vf')b=['vrai','faux'].map(v=>`<label class="check"><input type="radio" name="c${i}" ${q.a===v?'checked':''} onchange="S.d.qs[${i}].a='${v}'"> ${v==='vrai'?'Vrai':'Faux'} est la bonne réponse</label>`).join('');
  else if(q.t==='court')b=`<label for="a${i}">Réponses acceptées, séparées par |</label><input type="text" id="a${i}" placeholder="ex : mémoire vive | RAM" value="${esc(q.a)}" oninput="S.d.qs[${i}].a=this.value">`;
  else b='<p class="hint">Réponse rédigée : tu la corriges toi-même dans les résultats.</p>';
  return `<div class="card">
${q.ai?'<span class="aitag">Générée par l\'IA : à vérifier</span>':''}
<div class="row"><select class="grow" aria-label="Type de la question ${i+1}" onchange="setT(${i},this.value)">
<option value="qcm" ${q.t==='qcm'?'selected':''}>Choix multiple</option><option value="vf" ${q.t==='vf'?'selected':''}>Vrai ou faux</option><option value="court" ${q.t==='court'?'selected':''}>Réponse courte</option><option value="long" ${q.t==='long'?'selected':''}>Réponse rédigée</option></select>
<button class="btn small danger" style="margin:0" onclick="delQ(${i})" aria-label="Retirer la question ${i+1}">Retirer</button></div>
<label for="q${i}">Question ${i+1}</label><textarea id="q${i}" oninput="S.d.qs[${i}].q=this.value">${esc(q.q)}</textarea>
${b}
${q.t!=='long'?`<label class="check"><input type="checkbox" ${q.why?'checked':''} onchange="S.d.qs[${i}].why=this.checked"> Demander à l'élève d'expliquer sa réponse</label>`:''}
</div>`}
function setT(i,t){const old=S.d.qs[i];const n=blankQ(t);n.q=old.q;n.why=t==='long'?false:old.why;S.d.qs[i]=n;render()}
function addQ(t){S.d.qs.push(blankQ(t));render();window.scrollTo(0,document.body.scrollHeight)}
function delQ(i){if(S.d.qs.length<2)return;S.d.qs.splice(i,1);render()}
async function saveQuiz(draft){
  S.d.draft=!!draft;
  try{await api('/api/quizzes','POST',S.d);openClass(S.d.classId)}
  catch(e){S.err=e.message;render();window.scrollTo(0,document.body.scrollHeight)}
}

function flagTags(f){
  let h='';
  if(f.paste)h+=`<span class="tag warn">Collage tenté ×${f.paste}</span>`;
  if(f.leave)h+=`<span class="tag warn">A quitté la page ×${f.leave} (${fmtT(f.leaveMs)})</span>`;
  if(f.jump)h+=`<span class="tag warn">Texte apparu d'un coup ×${f.jump}</span>`;
  return h||'<span class="tag ok">Aucun signal</span>';
}
function vResults(){
  const q=S.rq,L=S.rl,done=L.filter(r=>r.finished);
  const tot=done.reduce((a,r)=>a+score(r).s,0),mx=done.length?score(done[0]).t:0;
  return `<button class="back" onclick="openClass('${esc(q.classId)}')">‹ Retour à la classe</button>
<h2>${esc(q.title)}</h2>
<p class="hint">${done.length} copie${done.length>1?'s':''} rendue${done.length>1?'s':''}${done.length?` · moyenne ${(tot/done.length).toFixed(1)} / ${mx}`:''}</p>
<button class="btn small" onclick="openRes('${esc(q.id)}')">Actualiser</button>
${L.length?L.map((r,i)=>{const sc=score(r);return `<div class="card">

<p style="margin:0 0 8px">${r.finished?`<b>${sc.s} / ${sc.t}</b>${sc.p?` <span class="muted">· ${sc.p} à corriger</span>`:''} <span class="muted">· ${fmtT(r.ms)}</span>${r.timeUp?' <span class="bad">· temps écoulé</span>':''}`:`<span class="tag warn">En cours · ${r.answers.length}/${r.total} questions</span>`}</p>

<button class="btn small primary" onclick="openDetail(${i})">Voir les réponses</button>

function openDetail(i){S.cur=S.rl[i];S.view='detail';render()}
function vDetail(){
  const r=S.cur,sc=score(r);
  return `<button class="back" onclick="go('results')">‹ Résultats</button>
<h2>${esc(r.name)}</h2>
<p><b>${sc.s} / ${sc.t}</b> <span class="muted">· ${fmtT(r.ms)}${r.finished?'':' · en cours'}</span></p>
<p>${flagTags(r.flags)}</p>
${r.answers.map((a,i)=>{
  const m=r.manual?r.manual[i]:undefined;const e=(m!==undefined&&m!==null)?m:(a.ok===true?1:a.ok===false?0:null);
  const st=e===1?'<span class="good">Juste</span>':e===0?'<span class="bad">Faux</span>':'<span class="tag warn">À corriger</span>';
  return `<div class="card"><p class="muted" style="margin:0">Question ${i+1} · ${fmtT(a.ms)} ${st}</p>
<p style="white-space:pre-wrap"><b>${esc(a.q)}</b></p>
<div class="ans"><span class="muted">Réponse de l'élève</span><b style="white-space:pre-wrap">${esc(a.given)||'(vide)'}</b></div>
${a.t!=='long'?`<div class="ans"><span class="muted">Réponse attendue</span><b>${esc(a.correct)}</b></div>`:''}
${a.why?`<div class="ans"><span class="muted">Explication de l'élève</span><b style="white-space:pre-wrap">${esc(a.why)}</b></div>`:''}
<div style="margin-top:12px"><button class="btn small" onclick="mark(${i},1)">Juste</button><button class="btn small" onclick="mark(${i},0)">Faux</button></div></div>`}).join('')}
<button class="btn danger" onclick="allowRetry()">Supprimer cette copie (l'élève pourra refaire)</button>`}
async function mark(i,v){
  const r=S.cur;
  try{await api('/api/results/'+S.rq.id+'/'+r.key+'/mark','POST',{i,v});r.manual=r.manual||{};r.manual[i]=v;render()}
  catch(e){alert(e.message)}
}
async function allowRetry(){
  if(!confirm('Supprimer cette copie ?'))return;
  try{await api('/api/results/'+S.rq.id+'/'+S.cur.key,'DELETE');openRes(S.rq.id)}catch(e){alert(e.message)}
}

/* ---------- Démarrage : si cet appareil est reconnu, on ouvre l'espace professeur ---------- */
(async function boot(){
  if(store.get('mm_token')){
    try{await api('/api/me');S.token=true;return enterTeacher()}catch(e){if(e.status===401)S.token=false}
  }
  render();
})();
</script>
</body>
</html>
